<title>Contagem de Estoque</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dde3;--ac:#0b5fd6;--ok:#127a3a;--rd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1c2027;--tx:#eceff3;--mu:#9aa4b2;--bd:#323944;--ac:#5b9bff;--ok:#4cc27a;--rd:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1c2027;--tx:#eceff3;--mu:#9aa4b2;--bd:#323944;--ac:#5b9bff;--ok:#4cc27a;--rd:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.sw{position:relative}
#sug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-top:4px;max-height:260px;overflow-y:auto;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sug div{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
#sug div:last-child{border:0}#sug div:hover,#sug .on{background:var(--bg)}
#sug b{color:var(--ac)}
.prod{margin-top:12px;display:none}
.prod h2{font-size:16px;margin:0 0 4px}
.info{font-size:13px;color:var(--mu);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.row{display:flex;gap:8px}.row button{flex:none;min-width:64px}
.grid input{text-align:center;font-size:20px;padding:12px 4px}
.grid label{text-align:center}
.res{margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px dashed var(--bd)}
.big{font-size:22px;font-weight:700;color:var(--ok)}
.sm{font-size:13px;color:var(--mu);margin-top:2px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.x{padding:6px 10px;color:var(--rd)}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it .d{font-size:14px;min-width:0}.it .d small{display:block;color:var(--mu)}
.tot{display:flex;justify-content:space-between;font-weight:700;margin-top:10px}
.empty{color:var(--mu);font-size:14px}
</style></head><body><main>

const $=i=>document.getElementById(i);
let cur=null,L=[],sel=0,hits=[];
try{L=JSON.parse(localStorage.getItem("cnt")||"[]")}catch(e){L=[]}
const save=()=>{try{localStorage.setItem("cnt",JSON.stringify(L))}catch(e){}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const N=id=>Math.max(0,Math.floor(Number($(id).value)||0));
function search(){
 const t=norm($("q").value.trim());
 if(!t){hits=[];$("sug").style.display="none";return}
 const w=t.split(/\s+/);
 hits=D.filter(p=>{const s=p[0]+" "+norm(p[1]);return w.every(x=>s.includes(x))});
 hits.sort((a,b)=>(String(b[0])===t)-(String(a[0])===t));
 hits=hits.slice(0,10);sel=0;draw();
}
function draw(){
 const s=$("sug");
 s.innerHTML=hits.length?"":"<div>Nenhum produto encontrado</div>";
 hits.forEach((p,i)=>{const d=document.createElement("div");if(i===sel)d.className="on";
  d.innerHTML="<b></b> \u2013 <span></span>";d.children[0].textContent=p[0];d.children[1].textContent=p[1];
  d.onmousedown=e=>{e.preventDefault();pick(p)};s.appendChild(d)});
 s.style.display="block";
}
function pick(p){
 cur=p;$("sug").style.display="none";$("q").value=p[0]+" \u2013 "+p[1];
 $("pn").textContent=p[0]+" \u2013 "+p[1];
 $("pi").textContent="1 pallet = "+p[2]+" cx \u00b7 "+(p[3]?"1 lastro = "+p[3]+" cx":"sem lastro")+" \u00b7 fator: "+p[4]+" un/cx";
 $("n1").disabled=!p[3];$("prod").style.display="block";clr();$("n0").focus();
}
function clr(){["n0","n1","n2","n3"].forEach(i=>$(i).value="");calc()}
function units(p){return (N("n0")*p[2]+N("n1")*p[3]+N("n2"))*p[4]+N("n3")}
function brk(p,u){
 const f=p[4];let cx=Math.floor(u/f),un=u%f,pa=Math.floor(cx/p[2]);cx-=pa*p[2];
 let la=p[3]?Math.floor(cx/p[3]):0;cx-=la*p[3];
 return pa+" pallet \u00b7 "+la+" lastro \u00b7 "+cx+" cx \u00b7 "+un+" un";
}
function fmt(p,u){const c=Math.floor(u/p[4]),r=u%p[4];return c+" cx"+(r?" + "+r+" un":"")}
function calc(){
 if(!cur)return;const u=units(cur);
 $("r1").textContent=fmt(cur,u);
 $("r2").textContent="Total: "+u+" unidades";
 $("r3").textContent=brk(cur,u);
}
function render(){
 const e=$("list");
 if(!L.length){e.innerHTML='<div class="empty">Nenhum item ainda.</div>';return}
 e.innerHTML="";let tc=0,tu=0;
 L.forEach((o,i)=>{const p=D.find(x=>x[0]===o.c);if(!p)return;
  tc+=Math.floor(o.u/p[4]);tu+=o.u;
  const r=document.createElement("div");r.className="it";
  r.innerHTML='<div class="d"><b></b> <span></span><small></small></div><button class="x">\u2715</button>';
  r.querySelector("b").textContent=p[0];r.querySelector("span").textContent=p[1];
  r.querySelector("small").textContent=fmt(p,o.u)+" ("+o.u+" un)";
  r.querySelector("button").onclick=()=>{L.splice(i,1);save();render()};e.appendChild(r)});
 const t=document.createElement("div");t.className="tot";t.innerHTML="<span>Total de caixas fechadas</span><span>"+tc+"</span>";e.appendChild(t);
}
$("q").oninput=search;
$("q").onkeydown=e=>{if(!hits.length)return;
 if(e.key==="ArrowDown"){sel=Math.min(sel+1,hits.length-1);draw();e.preventDefault()}
 else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();e.preventDefault()}
 else if(e.key==="Enter"&&$("sug").style.display==="block"){pick(hits[sel]);e.preventDefault()}
 else if(e.key==="Escape")$("sug").style.display="none"};
$("q").onblur=()=>setTimeout(()=>$("sug").style.display="none",150);
const F=["n0","n1","n2","n3"];
F.forEach((i,k)=>{$(i).oninput=calc;$(i).enterKeyHint=k<3?"next":"done";
 $(i).onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();
  const n=F.slice(k+1).find(x=>!$(x).disabled);
  if(n){$(n).focus()}else $("add").click()}});
$("clr").onclick=clr;
$("kb").onclick=()=>{const n=$("q").inputMode==="numeric";$("q").inputMode=n?"text":"numeric";$("kb").textContent=n?"123":"ABC";$("q").placeholder=n?"Digite parte da descrição":"Digite o código";$("q").blur();$("q").focus()};
$("add").onclick=()=>{if(!cur)return;const u=units(cur);if(!u){$("msg").textContent="Informe uma quantidade.";return}
 const o=L.find(x=>x.c===cur[0]);if(o)o.u+=u;else L.push({c:cur[0],u});
 save();render();clr();$("msg").textContent="";$("q").value="";$("prod").style.display="none";cur=null;$("q").focus()};
$("cp").onclick=async()=>{
 const t="C\u00f3digo\tDescri\u00e7\u00e3o\tCaixas\tUnidades soltas\tTotal un\n"+L.map(o=>{const p=D.find(x=>x[0]===o.c);return [p[0],p[1],Math.floor(o.u/p[4]),o.u%p[4],o.u].join("\t")}).join("\n");
 try{await navigator.clipboard.writeText(t);$("msg").textContent="Copiado! Cole no Excel."}catch(e){$("msg").textContent="N\u00e3o foi poss\u00edvel copiar neste navegador."}};
$("rs").onclick=()=>{if(L.length&&confirm("Apagar todos os itens contados?")){L=[];save();render()}};
render();
